<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="rGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  <rect x="7" y="7" width="114" height="114" rx="27" fill="none" stroke="url(#rGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Gaussian Bell Curve Background Graphic -->
  <path d="M 22 98 Q 42 96 52 82 Q 64 60 76 82 Q 86 96 106 98" fill="none" stroke="url(#curveGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6" filter="url(#glow)" />

  <!-- Modern Geometric R Glyph -->
  <!-- Vertical Stem -->
  <rect x="34" y="32" width="14" height="64" rx="7" fill="url(#rGrad)" filter="url(#glow)" />

  <!-- Upper Loop / Bowl -->
  <path d="M 44 32 H 72 C 86 32 94 40 94 50 C 94 60 86 68 72 68 H 44 Z" fill="none" stroke="url(#rGrad)" stroke-width="13" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)" />

  <!-- Inner Loop Cutout / Negative Space -->
  <path d="M 48 45 H 68 C 74 45 78 47 78 50 C 78 53 74 55 68 55 H 48 Z" fill="#0b1120" opacity="0.9" />

  <!-- Dynamic Diagonal Leg with Modern Terminal -->
  <path d="M 64 64 L 88 94" stroke="url(#rGrad)" stroke-width="13" stroke-linecap="round" filter="url(#glow)" />

  <!-- Accent Data Sparkle -->
  <circle cx="94" cy="34" r="4.5" fill="#38bdf8" filter="url(#glow)" />
</svg>
